server:
  port: 8080

spring:
  application:
    name: pocketpay

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false

security:
  jwt:
    secret: ${POCKETPAY_JWT_SECRET}
    issuer: pocketpay
    access-token-expiration: 900

app:
  mail:
    from: ${MAIL_FROM}
  frontend:
    base-url: ${FRONTEND_BASE_URL}

logging:
  level:
    root: INFO
    com.logy.pocketpay: INFO
    org.springframework.security: INFO